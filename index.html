<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Book Lab" />
<meta name="theme-color" content="#F4FAFE" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Quicksand is round wherever a letter can be round; Gowun Dodum is the softest
     Korean face an adult can still read a page of. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Gowun+Dodum&display=swap" />
<title>Book Lab</title>
<style>
  /* ── Santorini ───────────────────────────────────────────────────────────
     Whitewashed walls, cobalt domes, one sun, the Aegean at the foot of the
     page. Daylight is the default; night is the same island after dark, not a
     different place. Every surface colour is a token so the two stay in step. */
  :root{                       /* day: noon on the caldera */
    --bg:#F4FAFE; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#FFFFFF; --line:#DCEAF5;
    --text:#1E3D58; --sub:#7B97AD; --ink:#2A4A66;
    --well:#F5FAFE; --chip:#EAF3FB; --chip2:#DCEDF9; --dim:#F0F7FC; --ph:#A8BED0;
    --amber:#1E7BC8;   /* cobalt dome - the primary action */
    --green:#0E9384;   /* aegean - yes, that's mine */
    --gold:#F0B429;    /* the sun - stars, and the only warm note */
    --red:#E1776B;     /* terracotta - errors only */
    --violet:#C9578E;  /* bougainvillea - where the two readings differ */
    --onAccent:#FFFFFF;
    --amberTop:#3E95DD; --greenTop:#19AC9A;
    --grain:multiply; --grainO:.03; --shelfO:.95;
    --shadow:26,74,110;
    --ui:'Quicksand','Gowun Dodum',system-ui,-apple-system,'Segoe UI',sans-serif;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
  }
  html[data-theme="night"]{    /* night: lamps on the cliff, sea gone dark */
    --bg:#0E2436; --bg2:#123049; --panel:#173D5C; --panel2:#1B4568; --line:#2A5D83;
    --text:#EAF3FA; --sub:#92B3CB; --ink:#D8E8F4;
    --well:#123049; --chip:#194669; --chip2:#1F547B; --dim:#153A57; --ph:#6F92AD;
    --amber:#3E92D8; --green:#1FA896; --gold:#F5C453; --red:#E88274; --violet:#E279AC;
    --onAccent:#06243A;
    --amberTop:#5FA9E6; --greenTop:#33BFAC;
    --grain:overlay; --grainO:.05; --shelfO:.55;
    --shadow:0,0,0;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--text);font-family:var(--ui);font-weight:500;
    background:
      radial-gradient(120% 60% at 50% -12%, rgba(120,190,235,.20) 0%, rgba(180,220,242,.07) 46%, transparent 74%),
      linear-gradient(180deg, #FFFFFF 0%, var(--bg) 44%, #E6F2FA 100%);
    background-attachment:fixed;min-height:100vh}
  html[data-theme="night"] body{
    background:
      radial-gradient(120% 60% at 50% -12%, rgba(90,160,215,.22) 0%, rgba(40,90,130,.10) 46%, transparent 74%),
      linear-gradient(180deg, #14314A 0%, var(--bg) 46%, #081A29 100%);
    background-attachment:fixed}
  /* stucco, barely there */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:url(assets/paper.svg) repeat;background-size:220px 220px;
    opacity:var(--grainO);mix-blend-mode:var(--grain)}
  /* the village, at the foot of every screen */
  .shelf{position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:0;
    background:url(assets/skyline.svg) repeat-x bottom center;background-size:auto 150px;
    opacity:var(--shelfO);-webkit-mask-image:linear-gradient(180deg,transparent,#000 42%);
    mask-image:linear-gradient(180deg,transparent,#000 42%)}
  html[data-theme="night"] .shelf{filter:brightness(.62) saturate(1.25) hue-rotate(-6deg)}
  .wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:22px 15px 180px}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .mark{width:38px;height:29px;flex-shrink:0}
  h1{font-family:var(--ui);font-size:23px;font-weight:700;letter-spacing:.13em;
    color:var(--amber);margin:0}
  html[data-theme="night"] h1{color:#7FC0F0}
  .tag{font-size:13px;color:var(--sub);margin:0 0 18px;padding-bottom:14px;
    border-bottom:1px solid var(--line);line-height:1.6}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:26px;
    padding:19px;margin-bottom:13px;
    box-shadow:0 2px 6px -4px rgba(var(--shadow),.14), 0 18px 36px -26px rgba(var(--shadow),.40)}

  .big{width:100%;padding:17px;border-radius:999px;border:none;font-family:var(--ui);
    font-size:15.5px;font-weight:700;cursor:pointer;letter-spacing:.01em;transition:transform .09s}
  .big:active{transform:scale(.98)}
  .sm:active,.opt:active{transform:scale(.99)}
  .amber{background:linear-gradient(180deg,var(--amberTop),var(--amber));color:var(--onAccent);
    box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 8px 18px -10px rgba(30,123,200,.55)}
  .green{background:linear-gradient(180deg,var(--greenTop),var(--green));color:var(--onAccent);
    box-shadow:0 1px 0 rgba(255,255,255,.2) inset}
  .dark{background:var(--dim);color:var(--amber);border:1px solid var(--line)}
  .plain{background:var(--dim);color:var(--text);border:1px solid var(--line)}
  .sm{background:var(--chip);color:var(--sub);border:none;border-radius:999px;padding:8px 14px;
    font-size:12px;font-weight:600;cursor:pointer;font-family:var(--ui);transition:transform .09s}

  .opt{width:100%;text-align:left;padding:14px 16px;margin-bottom:9px;border-radius:20px;
    background:var(--well);border:1px solid var(--line);color:var(--text);font-size:14.5px;
    cursor:pointer;font-family:var(--ui);font-weight:500;line-height:1.45;transition:transform .09s}
  .opt b{color:var(--sub);margin-right:9px;font-weight:700}
  .opt.on{background:var(--chip2);border-color:var(--amber)}.opt.on b{color:var(--amber)}
  .opt:disabled{cursor:default}.opt.dim{opacity:.45}
  .dash{width:100%;padding:12px;border-radius:999px;background:transparent;border:1px dashed var(--line);
    color:var(--sub);font-size:13px;cursor:pointer;font-family:var(--ui);font-weight:600}

  .bar{display:flex;gap:5px;margin-bottom:16px}
  .bar i{flex:1;height:4px;border-radius:999px;background:var(--dim)}
  .bar i.on{background:var(--amber)}.bar i.v{background:var(--violet)}

  .q{font-size:19px;font-weight:600;line-height:1.55;margin-bottom:17px;color:var(--text)}
  .lbl{font-size:10px;color:var(--sub);letter-spacing:.14em;font-weight:700;
    margin-bottom:12px;text-transform:uppercase}
  .err{border-color:var(--red)!important;padding:14px}
  .err p{font-size:12.5px;color:var(--red);margin:0;font-weight:600}
  #errMore{margin-top:7px!important;font-size:10.5px!important;color:var(--sub)!important;
    cursor:pointer;text-decoration:underline;word-break:break-word;line-height:1.5;font-weight:500!important}
  .busy{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
  .spin{width:16px;height:16px;border:2px solid var(--amber);border-top-color:transparent;
    border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}

  .row{display:flex;gap:10px;text-align:center;margin-bottom:14px}
  .row>div{flex:1;background:var(--well);border:1px solid var(--line);border-radius:22px;padding:14px}
  .row>div.tap{cursor:pointer;transition:border-color .12s,background .12s}
  .row>div.tap:hover{border-color:var(--sub)}
  .row>div.on{border-color:var(--amber);background:var(--chip2)}
  .row .n{font-size:30px;font-weight:700;line-height:1}
  .row .l{font-size:9px;color:var(--sub);margin-top:5px;letter-spacing:.11em;font-weight:600}

  .langrow{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .lang{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;
    padding:7px 13px;font-size:10px;letter-spacing:.07em;cursor:pointer;font-family:var(--ui);font-weight:700}
  .lang b{color:var(--text);font-weight:700;margin-left:5px;font-size:12px}
  .lang.on{border-color:var(--amber);color:var(--amber)}.lang.on b{color:var(--amber)}

  .stars{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .stars .s{font-size:10px;color:var(--gold);width:44px}
  .stars .t{flex:1;height:8px;background:var(--well);border-radius:999px;overflow:hidden}
  .stars .f{height:100%;background:linear-gradient(90deg,var(--greenTop),var(--green));border-radius:999px}
  .stars .c{font-size:10px;color:var(--sub);width:14px;text-align:right}

  .book{display:flex;gap:9px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
  .book img,.book .ph{width:38px;height:52px;border-radius:7px;object-fit:cover;flex-shrink:0;
    background:var(--well);box-shadow:0 3px 10px -6px rgba(var(--shadow),.6)}
  .book .t{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book .m{font-size:11px;color:var(--sub);margin-top:1px}
  .book .w{font-size:11px;color:var(--violet);margin-top:2px;font-weight:600}
  .book .sm{padding:7px 10px;font-size:11px;flex-shrink:0}

  .verdict{padding:14px;border-radius:20px;margin-top:12px}
  .verdict h4{margin:0 0 5px;font-size:13.5px;font-weight:700}
  .verdict p{margin:0;font-size:12.5px;color:var(--sub);line-height:1.6}

  /* the report is a page from a book, so it keeps the serif */
  .sec{margin-bottom:14px}
  .sec h5{font-size:10px;font-weight:700;color:var(--amber);margin:0 0 5px;
    letter-spacing:.12em;text-transform:uppercase}
  .sec p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.68;color:var(--ink)}
  .essay{max-width:62ch}
  .essay p{margin:0 0 .8em;font-family:var(--serif);font-size:16px;line-height:1.78;
    color:var(--ink);text-indent:1.3em}
  .essay p:first-child{text-indent:0}
  .essay p:last-child{margin-bottom:0}
  .essay p:first-child::first-letter{float:left;font-family:var(--serif);font-weight:700;
    font-size:3.1em;line-height:.84;margin:.06em .08em 0 0;color:var(--amber)}
  .head{border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:15px}
  /* the handle on each part of a draft - visible before you touch anything */
  .pen{flex-shrink:0;font-size:10.5px;font-weight:700;letter-spacing:.03em;
    color:var(--violet);background:var(--chip2);border-radius:999px;padding:5px 11px;white-space:nowrap}
  .pen.on{background:var(--violet);color:#fff}
  .sec.fixable{cursor:pointer;border:1px dashed var(--line)}

  .ans{display:flex;gap:9px;padding:10px 0;border-top:1px solid var(--line)}
  .ans:first-child{border-top:none}
  .ans .qq{font-size:12px;color:var(--sub);line-height:1.45}
  .ans .aa{font-size:12px;margin-top:2px;font-weight:600}
  .note{font-size:11.5px;color:var(--sub);line-height:1.68;margin:11px 0 0}

  .det h6{margin:0 0 3px;font-size:13px;font-weight:700;font-family:var(--serif)}
  .det .row2{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .det .row2:first-of-type{border-top:none}
  .det .mini{font-size:11px;color:var(--sub);line-height:1.5}

  input{width:100%;padding:13px 15px;border-radius:16px;background:var(--well);
    border:1px solid var(--line);color:var(--text);font-size:15px;outline:none;
    font-family:var(--ui);font-weight:500}
  input:focus{border-color:var(--amber)}
  input::placeholder{color:var(--ph)}
  .hide{display:none!important}   /* must beat .cover{display:flex} below */
  /* While the AI is working, every tap lands here instead of on a button. A
     second tap used to start a second call whose answer replaced the first -
     the question on screen would change by itself a moment after it appeared. */
  #veil{position:fixed;inset:0;z-index:40;background:transparent;cursor:progress}
  .cover{display:flex;gap:12px;align-items:center;margin-top:14px}
  .cover img{width:64px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line);
    box-shadow:0 6px 16px -10px rgba(var(--shadow),.7)}

  /* --- phone is the default above. Tablet: more room, bigger type, and the
         stat tiles line up in one band instead of stacking two by two. --- */
  @media (min-width:680px){
    .wrap{max-width:740px;padding:30px 24px 210px}
    h1{font-size:26px}
    .tag{font-size:14px;margin-bottom:22px}
    .box{padding:22px;border-radius:30px}
    .big{padding:18px;font-size:16px}
    .opt{font-size:15px;padding:16px 18px}
    .q{font-size:21px}
    .sec p{font-size:16.5px}
    .essay p{font-size:17px;line-height:1.8}
    .book .t{font-size:16px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
    .stats .row{display:contents}
    .stats .row>div{margin:0}
    .stats>.genres,.stats>.langrow{grid-column:1/-1}
    .stats .n{font-size:32px!important}
    .shelf{height:190px;background-size:auto 190px}
  }
  /* --- Desktop: a page, not a stretched phone. The column stays a readable
         measure; the village does the rest of the width. --- */
  @media (min-width:1080px){
    .wrap{max-width:820px;padding:42px 28px 250px}
    h1{font-size:28px}
    .essay p{font-size:17.5px}
    .shelf{height:230px;background-size:auto 230px}
  }
  /* touch devices get targets you can actually hit with a thumb */
  @media (hover:none){
    .sm{padding:10px 14px}
    .lang{padding:9px 14px}
    .row>div.tap:hover{border-color:var(--line)}
  }
  /* a phone held sideways has almost no height to spare */
  @media (max-height:520px){
    .shelf{height:80px;background-size:auto 80px}
    .wrap{padding-bottom:100px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="mark" src="assets/mark.svg" alt="" />
    <h1>BOOK LAB</h1>
    <button id="themeBtn" class="sm" style="margin-left:auto" title="Day / night">☾</button>
    <button id="homeBtn" class="sm hide">My books</button>
  </div>
  <p class="tag">You read the book. Let's see how much the AI really knows about it.</p>

  <div id="who" class="box hide" style="padding:10px 12px"></div>

  <div id="setup" class="box hide">
    <div class="lbl">ONE-TIME SETUP (for Dad)</div>
    <p class="note" style="margin:0 0 10px">Enter the family code. It's kept on this device.</p>
    <input id="code" placeholder="family code" autocomplete="off" autocapitalize="none" spellcheck="false" />
    <button id="saveSetup" class="big amber" style="margin-top:12px">Save</button>
  </div>

  <div id="veil" class="hide"></div>
  <div id="err" class="box err hide"><p id="errText"></p><p id="errMore" class="hide"></p></div>
  <div id="busy" class="box busy hide"><div class="spin"></div><span id="busyText"></span></div>

  <div id="library"></div>
  <div id="quiz" class="hide"></div>
  <div id="follow" class="hide"></div>
  <div id="plan" class="hide"></div>
  <div id="report" class="hide"></div>
</div>

<div class="shelf" aria-hidden="true"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

  // ---------- config (server + family code live on this device only)
  var SRV = "https://readingbook-production.up.railway.app";  // not a secret - the family code is what guards the data
  // Readers belong to the household the family code opens, and arrive from the
  // server. Nothing about this family is baked into the page any more.
  var PROFILES = [];
  var HOUSEHOLD = "";
  var LEVELS = [
    ["a kindergartner", "유치원"], ["a 1st grader", "1학년"], ["a 2nd grader", "2학년"],
    ["a 3rd grader", "3학년"], ["a 4th grader", "4학년"], ["a 5th grader", "5학년"],
    ["a 6th grader", "6학년"], ["a 7th grader", "7학년"], ["an 8th grader", "8학년"],
    ["a 9th grader", "9학년"], ["a 10th grader", "10학년"], ["a 11th grader", "11학년"],
    ["a 12th grader", "12학년"], ["an adult reader", "성인"]
  ];
  function levelLabel(l) {
    var m = LEVELS.filter(function (x) { return x[0] === l; })[0];
    return m ? T(m[0].replace(/^an? /, ""), m[1]) : l;
  }
  // Not a person - the whole household's shelf. Read-only: you can look, but a
  // book is always saved to the person who read it.
  var FAMILY = { id: "all", name: "Family", icon: "👪" };
  // Tap-only on purpose - opening the emoji keyboard would put a text field on
  // the one screen that is meant to need none.
  // Faces come first: a kid picks the one that looks like how they feel today,
  // which is a better hook than a nice-looking animal.
  var ICONS = ["😀","😄","😎","🤓","🤔","🥰","🤗","😇",
               "🥳","😴","🙃","😤","😭","😳","🤪","😬",
               "🐻","🚗","🌸","☕","🦊","🐼","🦕","🚀",
               "⚽","🎸","🐙","🦉","🌙","⭐","🍀","🐳",
               "🎨","🧁","🦄","🐢","🔭","🧩","🌵","🍕"];
  function isFamily() { return cfg.profile === "all"; }
  var NOBODY = { id: "", name: "Reader", icon: "📖", level: "a young reader" };
  function who(id) {
    return PROFILES.filter(function (x) { return x.id === id; })[0] || PROFILES[0] || NOBODY;
  }
  function adoptMembers(rows) {
    PROFILES = (rows || []).map(function (m) {
      return { id: m.id, name: m.name, icon: m.icon || "📖", level: m.level,
               levelEn: m.level_en || null, adult: !!m.is_adult };
    });
  }
  var cfg = {
    srv: localStorage.getItem("bl:srv") || SRV,
    code: localStorage.getItem("bl:code") || "",
    profile: localStorage.getItem("bl:profile") || "henry"
  };
  // One code, one household. Everything the page draws about people comes from here.
  async function loadMe() {
    if (needSetup()) return;
    try {
      var me = await api("/me");
      HOUSEHOLD = me.household || "";
      adoptMembers(me.members);
      if (!PROFILES.length) { S.editing = "+"; }   // a brand new household: ask who reads
      else if (!PROFILES.filter(function (x) { return x.id === cfg.profile; }).length && cfg.profile !== "all") {
        cfg.profile = PROFILES[0].id; localStorage.setItem("bl:profile", cfg.profile);
      }
      err("");
    } catch (e) {
      fail(e, T("Couldn't reach the server.", "서버에 연결하지 못했어요."));
    }
    renderWho(); renderLibrary();
  }

  async function saveMember(body, thenClose) {
    try {
      var r = await api("/members", { method: "POST", body: JSON.stringify(body) });
      adoptMembers(r.members);
      if (thenClose) S.editing = null;
      if (!PROFILES.filter(function (x) { return x.id === cfg.profile; }).length && PROFILES.length) {
        cfg.profile = PROFILES[0].id; localStorage.setItem("bl:profile", cfg.profile);
      }
      renderWho(); renderLibrary(); loadBooks();
    } catch (e) { fail(e, T("Couldn't save that.", "저장하지 못했어요.")); }
  }

  async function removeMember(id) {
    if (!confirm(T("Remove this reader?", "이 사람을 지울까요?"))) return;
    try {
      var r = await api("/members/" + encodeURIComponent(id), { method: "DELETE" });
      adoptMembers(r.members); S.editing = null;
      if (cfg.profile === id && PROFILES.length) {
        cfg.profile = PROFILES[0].id; localStorage.setItem("bl:profile", cfg.profile);
      }
      renderWho(); renderLibrary(); loadBooks();
    } catch (e) { fail(e, T("Couldn't remove that reader.", "지우지 못했어요.")); }
  }

  // day or night - remembered per device, like the rest of the setup
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("themeBtn").textContent = t === "day" ? "\u2600\ufe0f" : "\U0001f319";
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "day" ? "#F4FAFE" : "#0E2436");
  }

  function P() {
    var id = cfg.profile === "test" ? "han" : cfg.profile;   // "test" was the old name for Han's shelf
    if (id === "all") return "all";
    if (PROFILES.filter(function (x) { return x.id === id; }).length) return id;
    return PROFILES.length ? PROFILES[0].id : "";
  }
  function RP() { return who(S.asProfile || P()); }   // never "all"; while revising, the book's owner
  function RN() { return RP().name; }                        // whose report the AI is writing
  // Level sets how hard; voice sets how it sounds. An adult writing about a book
  // should not read like a third grader, however gentle the app is elsewhere.
  function isAdult() { return !!RP().adult; }
  function voice() {
    return isAdult()
      ? (L() === "ko" ? "Write in natural adult Korean, 평서체, 담백하고 군더더기 없이. No childish phrasing."
                      : "Write the way a literate adult writes: clear, plain sentences, no childish phrasing and no exclamation marks.")
      : (L() === "ko" ? "Write in simple Korean (해요체) a child reads easily."
                      : "Simple words, the way a kid actually talks.");
  }

  function RL() {                      // English can be stretched past grade level; Korean isn't
    var pr = RP();
    return (L() === "en" && pr.levelEn) ? pr.levelEn : pr.level;
  }
  function qp(path) { return path + (path.indexOf("?") < 0 ? "?" : "&") + "profile=" + P(); }
  function needSetup() { return !cfg.srv || !cfg.code; }

  // ---------- state
  var S = { books: [], title: "", author: "", cover: null, qs: [], qi: 0, ans: [], picked: null, fqs: [], fi: 0, fans: [], report: null, edits: [], stat: null, editing: null, working: false, editingId: null, editBase: null, asProfile: null, report0: null };

  // ---------- server
  // What the reader is told when the machine behind the machine says no.
  // "Server said no (502)" is true and useless; every one of these has a
  // different thing the grown-up has to go and do.
  var FAIL = {
    no_credit:     ["The AI account is out of credit. Dad needs to top it up.", "AI 계정에 크레딧이 떨어졌어요. 아빠가 충전해야 해요."],
    rate_limited:  ["Too many questions at once. Wait a minute and try again.", "한꺼번에 너무 많이 물어봤어요. 잠깐 뒤에 다시 해요."],
    overloaded:    ["The AI is very busy right now. Try again in a minute.", "AI가 지금 너무 바빠요. 잠깐 뒤에 다시 해요."],
    bad_key:       ["The AI key isn't working. Dad needs to check it.", "AI 열쇠가 안 맞아요. 아빠가 확인해야 해요."],
    image_too_big: ["That photo was too big. Try taking it again.", "사진이 너무 커요. 다시 찍어볼래요?"],
    daily_cap:     ["That's all the AI for today. It starts again tomorrow.", "오늘 AI는 여기까지예요. 내일 다시 할 수 있어요."],
    upstream:      ["The AI didn't answer this time. Try again.", "AI가 이번엔 대답을 안 했어요. 다시 해볼래요?"]
  };

  async function api(path, opts) {
    var r = await fetch(cfg.srv.replace(/\/$/, "") + path, Object.assign({ headers: { "Content-Type": "application/json", "x-family-code": cfg.code } }, opts || {}));
    if (r.status === 401) throw new Error(T("Family code doesn't match. Ask Dad.", "가족 코드가 안 맞아요. 아빠한테 물어봐요."));
    if (!r.ok) {
      var d = null;
      try { d = (await r.json()).detail; } catch (e) { }
      var code = d && d.code;
      var m = FAIL[code] || FAIL.upstream;
      var e2 = new Error(T(m[0], m[1]));
      e2.code = code || "http_" + r.status;
      // the grown-up version, kept out of the child's way but one tap from Dad
      e2.detail = (d && d.detail) || (typeof d === "string" ? d : "") || ("HTTP " + r.status);
      throw e2;
    }
    return r.json();
  }
  // draw the photo down to something sane before it ever leaves the device
  function shrink(file, maxSide, quality) {
    return new Promise(function (res, rej) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var w = img.width, h = img.height, k = Math.min(1, maxSide / Math.max(w, h));
        var cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        var data = cv.toDataURL("image/jpeg", quality);
        res({ b64: data.split(",")[1], w: cv.width, h: cv.height });
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("couldn't read that photo")); };
      img.src = url;
    });
  }

  function aiPhoto(system, b64, ask, maxTokens) {
    return ai(system, [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } },
      { type: "text", text: ask }] }], maxTokens);
  }

  async function ai(system, messages, maxTokens) {
    var d = await api("/ai", { method: "POST", body: JSON.stringify({ system: system, messages: messages, max_tokens: maxTokens || 1600 }) });
    return d.text || "";
  }

  // ---------- parsing
  function tag(raw, n) { var m = raw.match(new RegExp("<" + n + ">([\\s\\S]*?)<\\/" + n + ">", "i")); return m ? m[1].trim() : null; }
  function kv(b) { if (!b) return null; var o = {}; b.split("\n").forEach(function (l) { var i = l.indexOf(":"); if (i > 0) { var k = l.slice(0, i).trim().toLowerCase(), v = l.slice(i + 1).trim(); if (k && v) o[k] = v; } }); return Object.keys(o).length ? o : null; }
  function blocks(raw, n) { var out = [], re = new RegExp("<" + n + ">([\\s\\S]*?)<\\/" + n + ">", "gi"), m; while ((m = re.exec(raw)) !== null) { var p = kv(m[1]); if (p) out.push(p); } return out; }

  // ---------- ui helpers
  function show(id) {
    ["library", "quiz", "follow", "plan", "report"].forEach(function (v) { $(v).classList.toggle("hide", v !== id); });

        var db = el("button", "sm", "✕"); db.style.color = "var(--sub)"; db.onclick = async function () { if (!confirm("Remove this book?")) return; try { await api("/books/" + x.id + "?profile=" + (isFamily() ? (x.profile || "henry") : P()), { method: "DELETE" }); } catch (e) { fail(e, T("Couldn't remove it.", "못 지웠어요.")); } loadBooks(); };

  // what's behind each number. Same data the tiles counted, just spelled out.

  function statDetail(kind) {
    var box = el("div", "box det"), body = el("div");
    var head = { books: "EVERY BOOK YOU'VE FINISHED", month: "FINISHED THIS MONTH",
                 streak: "YOUR WEEKS, MOST RECENT FIRST", diff: "WHERE YOU AND THE AI READ IT DIFFERENTLY",
                 en: "READ IN ENGLISH", ko: "한글로 읽은 책" }[kind];
    box.innerHTML = '<div class="lbl" style="color:var(--amber)">' + head + '</div>';

    if (kind === "books" || kind === "month" || kind === "en" || kind === "ko") {
      var ym = new Date().toISOString().slice(0, 7);
      var list = kind === "month" ? S.books.filter(function (x) { return (x.date || "").slice(0, 7) === ym; })
               : kind === "ko"    ? S.books.filter(function (x) { return x.lang === "ko"; })
               : kind === "en"    ? S.books.filter(function (x) { return x.lang !== "ko"; })

      if (!list.length) body.innerHTML = '<p class="note" style="margin:0">' + (kind === "ko" ? "아직 한글책은 없어요." : "Nothing here yet.") + '</p>';
      else list.forEach(function (x) { body.appendChild(bookLine(x)); });

    } else if (kind === "streak") {
      var byWeek = {};
      S.books.forEach(function (x) { var k = weekKey(new Date(x.date)); (byWeek[k] = byWeek[k] || []).push(x); });
      var now = new Date(), any = false;
      for (var i = 0; i < 52; i++) {
        var d = new Date(now - i * 6048e5), k = weekKey(d), got = byWeek[k];
        if (!got) { if (i === 0) continue; break; }

        var r = el("div", "row2");
        var mon = new Date(d - ((d.getDay() + 6) % 7) * 864e5);
        r.innerHTML = '<div style="width:78px;flex-shrink:0"><div class="mini" style="color:var(--amber);font-weight:800">' +
          (i === 0 ? "This week" : "Week of") + '</div><div class="mini">' + mon.toISOString().slice(5, 10).replace("-", "/") + '</div></div>' +
          '<div style="flex:1;min-width:0">' + got.map(function (x) { return '<h6>' + esc(x.title) + '</h6>'; }).join("") + '</div>' +
          '<div style="color:var(--gold);font-weight:800;align-self:center">' + got.length + '</div>';
        body.appendChild(r);
      }
      if (!any) body.innerHTML = '<p class="note" style="margin:0">Read one book this week to start a streak.</p>';

    } else {
      S.books.forEach(function (x) {
        (x.answers || []).filter(function (a) { return !a.aiSame; }).forEach(function (a) {
          var r = el("div", "row2");
          r.innerHTML = '<span style="color:var(--violet);font-weight:800">\u2726</span>' +
            '<div style="flex:1;min-width:0"><div class="mini" style="color:var(--amber)">' + esc(x.title) + '</div>' +
            '<h6 style="font-weight:400;line-height:1.4;margin:2px 0 3px">' + esc(a.q) + '</h6>' +
            '<div class="mini" style="color:var(--text)">You said: ' + esc(a.pickedText) + '</div>' +
            '<div class="mini">The AI picked ' + esc(String(a.aiPick || "?").toUpperCase()) +
            ', ' + esc(String(a.sure || "medium").toLowerCase()) + ' confidence</div></div>';
          body.appendChild(r);
        });
      });
      if (!body.firstChild) body.innerHTML = '<p class="note" style="margin:0">So far you and the AI have read every question the same way.</p>';
    }

    box.appendChild(body);
    return box;
  }

  // ---------- photo → title
  async function onPhoto(e) {

        b64, "What book is this?", 300);

  // ---------- quiz
  function L() { return S.lang === "ko" ? "ko" : "en"; }
  function T(en, ko) { return L() === "ko" ? ko : en; }

  async function startQuiz() {
    if (S.working) return;

    err(""); busy(T("Making your questions...", "문제를 만드는 중..."));
    try {
      var langNote = L() === "ko"
        ? "This is a KOREAN book. Write everything — questions, choices, genre — in simple Korean a Korean 3rd grader reads easily (반말 아님, 존댓말 아님 — just plain 해요체)."
        : "Write everything in simple English a 3rd grader knows.";
      var raw = await ai('You make reading quizzes for ' + RN() + ', ' + RL() + '. They just read "' + S.title + '"' + (S.author ? ' by ' + S.author : '') + '.\n' + langNote + '\n\nFirst, tag the book:\n<meta>\ngenre: (ONE word from: adventure, fantasy, funny, animals, science, mystery, friendship, sports, history, scary, other)\nkind: (fiction or nonfiction)\n</meta>\n\nThen write 5 multiple-choice questions about this book.\nMix them up: what happened, who did what, why someone did something, how a character felt, what the book is really about.\n\nImportant: you have NOT actually read this book — you only know about it. So for each question, also say which answer YOU think is right and how sure you are.\nIf you truly don\'t know the book, still write questions a reader could answer, and mark your confidence low.\n\nUse exactly this format, five times:\n<q>\ntext: (the question)\na: (option)\nb: (option)\nc: (option)\nd: (option)\nmypick: (a, b, c, or d — what you think)\nsure: (high, medium, or low)\n</q>',
        [{ role: "user", content: "Make the quiz" }], 2200);
      var meta = kv(tag(raw, "meta")) || {};
      S.genre = (meta.genre || "other").toLowerCase().trim();
      S.kind = (meta.kind || "fiction").toLowerCase().trim();
      var qs = blocks(raw, "q").filter(function (q) { return q.text && q.a && q.b && q.c && q.d; }).slice(0, 5);
      if (!qs.length) throw new Error("no questions");

  function renderQuiz() {

        '<p>' + T("It picked", "AI가 고른 건") + ' <b style="color:var(--text)">' + esc((q.mypick || "?").toUpperCase()) + '</b>' + T(" and said it was " + esc((q.sure || "medium").toLowerCase()) + " confidence. ", "이고, 자신감은 " + esc((q.sure || "medium").toLowerCase()) + "이래요. ") +
        (same ? T("Same answer — and you're the one who actually read it.", "같은 답이에요 — 그리고 진짜 읽은 사람은 " + RN() + "이고요.") : T("You read the book; it only guessed. Open the book and see where the two of you part ways.", "" + RN() + "는 읽었고 AI는 추측했어요. 책을 펴서 어디서 갈렸는지 봐요.")) + '</p>';

  function pick(k) {

  function next() { if (S.qi + 1 < S.qs.length) { S.qi++; S.picked = null; renderQuiz(); } else makeFollowups(); }

  // ---------- follow-up (feelings)
  async function makeFollowups() {

      var raw = await ai(RN() + ' is ' + RL() + '.\nThey just finished "' + S.title + '"' + (S.author ? ' by ' + S.author : '') + ' and answered these quiz questions:\n' + lines + '\n\nThose told you what happened in the book, but not how they felt about it.\nAsk 3 short questions about their own opinion and feelings — things only they can answer.\nGood things to ask about: which character they liked most, how the ending made them feel, whether they would tell a friend to read it, what part surprised them, whether they want a similar book next.\n\nWrite every question in the second person — say "you". Never use their name and never write about them in the third person; you are speaking to them directly.\n\n' + voice() + ' Give 4 answer choices they can just tap. Make the choices feel different from each other, and make them sound like something they would actually say.\n\nUse exactly this format, three times:\n<fq>\ntext: (the question)\na: (choice)\nb: (choice)\nc: (choice)\nd: (choice)\n</fq>',
        [{ role: "user", content: "Ask them" }], 1200);

      if (!fq.length) { busy(""); return makeReport(); }

    } catch (x) {

      busy(""); return makeReport();
    }

  }
  function renderFollow() {
    var q = S.fqs[S.fi], F = $("follow"); F.innerHTML = "";
    var b = el("div", "box");
    b.innerHTML = '<div class="bar">' + S.fqs.map(function (_, i) { return '<i class="' + (i <= S.fi ? "v" : "") + '"></i>'; }).join("") + '</div>' +
      '<div style="font-size:11px;color:var(--violet);margin-bottom:8px">✦ ' + T("Only you can answer this one", "이건 " + RN() + "만 답할 수 있어요") + ' — ' + (S.fi + 1) + ' / ' + S.fqs.length + '</div>' +
      '<div class="q">' + esc(q.text) + '</div><div id="fopts"></div>';

    var rr = el("button", "dash", T("None of these fit me — show other choices", "다 아닌데… 다른 걸로 보여줘")); rr.onclick = reroll; $("fopts").appendChild(rr);
  }
  function answerFollow(L) {
    var q = S.fqs[S.fi]; S.fans.push({ q: q.text, answer: q[L] });
    if (S.fi + 1 < S.fqs.length) { S.fi++; renderFollow(); } else { renderPlan(); show("plan"); }
  }

  // ---------- plan the writing: who reads it, and what order
  function renderPlan() {
    S.audience = S.audience || null; S.order = S.order || [];
    var P = $("plan"); P.innerHTML = "";
    var box = el("div", "box");
    box.innerHTML = '<div style="font-size:10px;color:var(--violet);letter-spacing:.12em;margin-bottom:6px">✦ ' + T("BEFORE THE AI WRITES", "AI가 쓰기 전에") + '</div>' +
      '<div class="q" style="margin-bottom:10px">' + T("Who is going to read this?", "이 글은 누가 읽을 거예요?") + '</div><div id="aud" style="display:flex;gap:8px;margin-bottom:22px"></div>' +
      '<div class="q" style="margin-bottom:6px">' + T("What do you want to say first?", "뭐부터 말할래요?") + '</div>' +
      '<p class="note" style="margin:0 0 12px">' + T("Tap the parts in the order you want them. Pick as many as you like.", "말하고 싶은 순서대로 눌러요. 몇 개든 괜찮아요.") + '</p>' +
      '<div id="parts"></div><div id="orderShow" style="min-height:22px;font-size:12px;color:var(--amber);margin:6px 0 14px"></div>';
    P.appendChild(box);

    var AUD = [["teacher", T("My teacher", "선생님"), "🍎"], ["friend", T("A friend", "친구"), "👦"], ["me", T("Just me", "나만"), "📓"]];
    AUD.forEach(function (a) {

      b.style.cssText = "flex:1;text-align:center;padding:14px 6px;margin:0;font-size:13px" + (S.audience === a[0] ? ";background:rgba(255,194,77,.16);border-color:var(--amber)" : "");
      b.onclick = function () { S.audience = a[0]; renderPlan(); };
      $("aud").appendChild(b);
    });

    SECTIONS.forEach(function (sec) {
      var k = sec[0], idx = S.order.indexOf(k);
      var b = el("button", "opt", (idx >= 0 ? '<b style="color:var(--amber)">' + (idx + 1) + '</b>' : '<b>·</b>') + T(sec[1], sec[2]));
      if (idx >= 0) b.classList.add("on");
      b.onclick = function () { if (idx >= 0) S.order.splice(idx, 1); else S.order.push(k); renderPlan(); };

    $("orderShow").textContent = S.order.length ? S.order.map(function (k, i) { var sec = SECTIONS.filter(function (x) { return x[0] === k; })[0]; return (i + 1) + ". " + T(sec[1], sec[2]); }).join("  →  ") : "";

    var go = el("button", "big amber", T("OK, write it like that", "좋아요, 그렇게 써줘"));
    go.disabled = !S.audience || !S.order.length; go.style.opacity = go.disabled ? .4 : 1;
    go.onclick = makeReport; P.appendChild(go);
    var skip = el("button", "dash", T("Just write it — I'll fix it after", "그냥 써줘 — 나중에 고칠게")); skip.style.marginTop = "8px";
    skip.onclick = function () { S.audience = S.audience || "me"; S.order = SECTIONS.map(function (x) { return x[0]; }); makeReport(); };
    P.appendChild(skip);
  }
  async function reroll() {
    if (S.working) return;
    var q = S.fqs[S.fi]; busy(T("Thinking of other choices...", "다른 보기를 생각하는 중..."));
    try {
      var raw = await ai(RN() + ' (' + RL() + ') was asked: "' + q.text + '"\nNone of these fit them: ' + q.a + ' / ' + q.b + ' / ' + q.c + ' / ' + q.d + '\nGive 4 completely different choices for the same question. ' + (L() === "ko" ? "In simple Korean." : "Simple words.") + ' '  + voice() + '\n\n<fq>\ntext: ' + q.text + '\na: (choice)\nb: (choice)\nc: (choice)\nd: (choice)\n</fq>',
        [{ role: "user", content: "Other choices please" }], 600);
      var f = blocks(raw, "fq")[0]; if (f && f.a) { f.text = q.text; S.fqs[S.fi] = f; renderFollow(); }
    } catch (x) { }
    busy("");
  }

  // ---------- report
  var SECTIONS = [["summary", "What it's about", "무슨 이야기예요?"], ["favorite", "My favorite part", "제일 좋았던 부분"], ["feeling", "How it made me feel", "읽고 나서 느낌"], ["learned", "What I take from it", "배운 것"], ["recommend", "Would I tell a friend?", "친구에게 추천할까?"]];

  async function makeReport() {
    if (S.working) return;
    busy(T("Writing your book report...", "독후감을 쓰는 중..."));
    try {
      var lines = S.ans.map(function (a, i) { return (i + 1) + ". " + a.q + "\n   " + RN() + " answered: " + a.pickedText; }).join("\n");
      var feel = S.fans.length ? S.fans.map(function (a) { return "- " + a.q + "\n  " + RN() + " said: " + a.answer; }).join("\n") : "(they didn't add anything)";
      var AUDN = { teacher: "their teacher — so a little more careful and complete, but still their own words", friend: "a friend — so casual and easy, the way they would actually tell someone", me: "only themselves — a private note, honest, can be short" };
      var order = (S.order && S.order.length) ? S.order : SECTIONS.map(function (x) { return x[0]; });
      var DESC = { summary: "(2 sentences about what the book is about, based on their answers)", favorite: "(1-2 sentences about the part or character they liked, in their voice)", feeling: "(1-2 sentences about how the book made them feel, based on what they said)", learned: "(1 sentence about what they might take away from it)", recommend: "(1 short sentence — would they tell a friend to read it, and why)" };
      var fmt = order.map(function (k) { return k + ": " + DESC[k]; }).join("\n");
      var raw = await ai('You help ' + RN() + ', ' + RL() + ', write a short book report about a book they just finished.\nUse their own answers below. Write it in THEIR voice — honest, unforced, the way they would actually put it. ' + voice() + '\n' + (L() === "ko" ? voice() : "") + '\nWrite it in the first person, as them — "I", never their name and never "he" or "she". Never invent things they didn\'t say. If you\'re unsure about a detail, leave it out.\n\nWho will read it: ' + (AUDN[S.audience] || AUDN.me) + '\n' + RN() + ' decided the ORDER themselves. Write ONLY these parts, in exactly this order. They will be printed as one continuous piece with no headings, so each part must read as the next paragraph of a single essay \u2014 carry the thread forward, never restate the question, never announce what the part is about:\n' + order.join(" → ") + '\n\nBook: ' + S.title + (S.author ? ' by ' + S.author : '') + '\n\nWhat they answered about the story:\n' + lines + '\n\nWhat they said about how they felt:\n' + feel + '\n\nTheir feelings matter most — build the report around those, and use the story answers for the facts.\n\nFormat exactly:\n<report>\n' + fmt + '\nstars: (a number 1-5 based on what they said)\n</report>',
        [{ role: "user", content: "Write the report" }], 900);
      var r = kv(tag(raw, "report"));
      if (!r) throw new Error("no report");
      S.draft = r;
      S.report0 = JSON.parse(JSON.stringify(S.draft));   // frozen: what the AI wrote before anyone touched it
      renderConfirm(); show("report");
    } catch (x) { err(T("Couldn't write the report. Try once more.", "독후감을 못 썼어요. 한 번 더 해볼래요?")); }
    busy("");
  }

  // Henry reads the draft and says yes, or fixes one part at a time
  var FIXES = [
    ["longer",  "Longer",        "더 길게",   "Make it longer. Add a sentence or two that build on what they already said — no new facts."],
    ["detail",  "More detail",   "자세히",    "Add concrete detail — what happened, where, who. Only things they actually mentioned."],
    ["funnier", "Funnier",       "더 재밌게", "Make it funnier — the kind of joke this reader would actually make."],
    ["why",     "Say why",       "왜 그런지", "Add the reason — WHY. Use what they actually answered."],
    ["name",    "Use the name",  "이름 넣기", "Use the character's actual name instead of 'he' or 'the character'."],
    ["feeling", "More feeling",  "느낌 더",   "Say more about how it made them feel, in their own words."],
    ["easier",  "Simpler words", "쉬운 말로", "Use simpler, shorter words. Nothing the reader would have to look up."],
    ["nospoil", "Don't spoil",   "결말 빼기", "Don't give away the ending or the big surprise. Keep it a secret for the reader."],
  ];

  function renderConfirm() {
    var r = S.draft, R = $("report"); R.innerHTML = "";
    var order = (S.order && S.order.length) ? S.order : SECTIONS.map(function (x) { return x[0]; });
    var AUDL = { teacher: T("for my teacher", "선생님께"), friend: T("for a friend", "친구에게"), me: T("just for me", "나만 보기") };
    if (S.editingId) {
      var eb = el("div", "box");
      eb.style.cssText = "border-color:var(--violet);padding:12px 14px";
      eb.innerHTML = '<div style="font-size:12px;font-weight:800;color:var(--violet)">✎ ' +
        T("Revising a report you already saved", "이미 저장한 독후감을 고치는 중") + '</div>' +
        '<p class="note" style="margin:5px 0 0">' +
        T("Finished " + esc(S.editBase.date) + ". Everything you change from here is added to the same record.",
          esc(S.editBase.date) + "에 쓴 글이에요. 여기서 고친 건 같은 기록에 이어서 남아요.") + '</p>';
      var cx = el("button", "sm", T("Leave it as it was", "그냥 두기"));
      cx.style.cssText = "margin-top:10px;color:var(--sub)";
      cx.onclick = function () { resetRun(); show("library"); };
      eb.appendChild(cx);
      R.appendChild(eb);
    }

    var box = el("div", "box");
    box.innerHTML = '<div style="font-size:10px;color:var(--violet);letter-spacing:.12em;margin-bottom:6px">✦ ' + (S.editingId ? T("READ IT AGAIN — WHAT WOULD YOU CHANGE?", "다시 읽어봐요 — 뭘 고칠까요?") : T("READ IT — IS THIS YOU?", "읽어봐요 — " + RN() + " 말이 맞아요?")) + '</div>' +
      '<div style="font-size:17px;font-weight:900;line-height:1.25;margin-bottom:2px">' + esc(S.title) + '</div>' +
      '<div style="font-size:11px;color:var(--sub);margin-bottom:4px">' + (AUDL[S.audience] || "") + '</div>' +
      '<div style="font-size:15px;color:var(--gold);margin-bottom:14px">' + stars(r.stars) + '</div>' +
      '<p class="note" style="margin:0 0 12px">' + T("Every part has a ✎ — tap it to change how that part is written.", "부분마다 ✎ 가 있어요. 누르면 그 부분을 고칠 수 있어요.") + '</p><div id="secs"></div>';
    R.appendChild(box);

    order.forEach(function (k) {
      var sec = SECTIONS.filter(function (x) { return x[0] === k; })[0];
      if (!sec || !r[k]) return;
      var d = el("div", "sec");
      d.className = "sec fixable";
      d.style.cssText = "padding:12px 13px;border-radius:14px;background:var(--well);margin-bottom:10px;cursor:pointer";
      // The chips used to be invisible until you happened to tap the paragraph.
      // Now every part wears the handle, and the first one is already open so the
      // mechanism is shown once rather than explained.
      var open0 = (order.filter(function (kk) { return r[kk]; })[0] === k);
      d.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
          '<h5 style="margin:0;flex:1">' + T(sec[1], sec[2]) + '</h5>' +
          '<span class="pen" id="pen_' + k + '">✎ ' + T("fix this", "고치기") + '</span></div>' +
        '<p>' + esc(r[k]) + '</p>' +
        '<div class="fixrow' + (open0 ? '' : ' hide') + '" id="fix_' + k + '" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:11px"></div><div id="alt_' + k + '"></div>';
      d.onclick = function (e) {
        if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT") return;
        var row = $("fix_" + k), pen = $("pen_" + k);
        row.classList.toggle("hide");
        pen.classList.toggle("on", !row.classList.contains("hide"));
      };
      if (open0) setTimeout(function () { var pn = $("pen_" + k); if (pn) pn.classList.add("on"); }, 0);
      $("secs").appendChild(d);
      var row = $("fix_" + k);
      FIXES.forEach(function (f) {
        var b = el("button", "sm", T(f[1], f[2])); b.style.cssText = "padding:8px 11px;font-size:12px;color:var(--amber);background:var(--chip2)";
        b.onclick = function (e) { e.stopPropagation(); fixSection(k, f); };
        row.appendChild(b);
      });
      var cust = el("button", "sm", "✏️ " + T("Tell it myself", "내가 말할게"));
      cust.style.cssText = "padding:8px 11px;font-size:12px;font-weight:800;color:var(--violet);background:var(--chip2)";
      cust.onclick = function (e) { e.stopPropagation(); openCustom(k); };
      row.appendChild(cust);
    });

    var ok = el("button", "big green", "✓ " + (S.editingId ? T("Save the changes", "고친 걸 저장할게요") : T("Yes, that's my report!", "네, 이게 제 독후감이에요!"))); ok.style.marginBottom = "9px";
    ok.onclick = saveReport; R.appendChild(ok);
    var st = el("div"); st.style.cssText = "display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:6px";
    st.innerHTML = '<span style="font-size:11px;color:var(--sub)">' + T("Stars:", "별점:") + '</span>' + [1, 2, 3, 4, 5].map(function (n) { return '<button class="sm stb" data-n="' + n + '" style="padding:6px 9px;color:' + (n <= (parseInt(r.stars) || 3) ? "var(--gold)" : "var(--line)") + '">★</button>'; }).join("");
    R.appendChild(st);
    Array.prototype.forEach.call(document.querySelectorAll(".stb"), function (b) { b.onclick = function () { S.draft.stars = b.getAttribute("data-n"); renderConfirm(); }; });
  }

  // typing is the fallback here, never the main path - the chips do the work
  function openCustom(k) {
    var host = $("alt_" + k); if (!host) return;
    if (host.firstChild) { host.innerHTML = ""; return; }
    var wrap = el("div"); wrap.style.cssText = "display:flex;gap:6px;margin-top:9px";
    var i = el("input"); i.placeholder = T("Tell the AI what to change", "어떻게 바꿀지 말해요"); i.style.flex = "1";
    var g = el("button", "sm", T("Go", "고치기"));
    g.style.cssText = "padding:8px 15px;font-size:12px;font-weight:800;color:var(--bg);background:var(--violet)";
    function run() { var t = i.value.trim(); if (!t) return; host.innerHTML = ""; fixSection(k, ["custom", "Custom", "내 말", ""], t); }
    g.onclick = function (e) { e.stopPropagation(); run(); };
    i.onclick = function (e) { e.stopPropagation(); };
    i.onkeydown = function (e) { e.stopPropagation(); if (e.key === "Enter") run(); };
    wrap.appendChild(i); wrap.appendChild(g); host.appendChild(wrap); i.focus();
  }

  async function fixSection(k, f, custom) {
    if (S.working) return;
    var before = S.draft[k];
    busy(T("Rewriting...", "다시 쓰는 중..."));
    try {
      var raw = await ai(RN() + ' (' + RL() + ') is editing their book report about "' + S.title + '". This part:\n"' + before + '"\n\nTheir instruction: ' + (custom ? 'do exactly this, in their own words: "' + custom + '"' : f[3]) + '\n\nWhat they actually said about the book: ' + S.fans.map(function (a) { return a.answer; }).join(" / ") + '\nRewrite just that part following their instruction. Keep their voice. ' + voice() + ' Do not add facts they never mentioned.\n<new>\n(the rewritten part)\n</new>',
        [{ role: "user", content: "Rewrite" }], 600);
      var nt = tag(raw, "new");
      if (nt) {
        // the whole point of the app: a person overrode the machine, so keep the receipt
        S.edits.push({ at: new Date().toISOString(), section: k, fix: f[0], label: f[1],
                       custom: custom || "", lang: L(), before: before, after: nt,
                       beforeLen: (before || "").length, afterLen: nt.length });
        S.draft[k] = nt; renderConfirm();
      }
      else err(T("Couldn't rewrite that. Try another button.", "다시 못 썼어요. 다른 버튼을 눌러봐요."));
    } catch (x) { fail(x, T("Couldn't rewrite that.", "다시 못 썼어요.")); }
    busy("");
  }

  async function saveReport() {
    if (S.working) return;
    busy(T("Saving...", "저장하는 중..."));
    try {
      var base = S.editBase;
      var wins = S.ans.filter(function (a) { return !a.aiSame; }).length;
      var entry = {
        id: S.editingId || Date.now(),
        profile: base ? (base.profile || "henry") : P(),
        title: S.title, author: S.author, cover: S.cover, thumb: S.thumb || null,
        date: base ? base.date : new Date().toISOString().slice(0, 10),
        lang: L(), genre: S.genre || "other", kind: S.kind || "fiction",
        audience: S.audience || "me", order: S.order || [],
        answers: S.ans, follow: S.fans, report: S.draft,
        report0: S.report0 || null,
        edits: S.edits || [],
        henryWins: wins, aiWins: S.ans.length - wins,
        updatedAt: new Date().toISOString()
      };
      await api("/books", { method: "POST", body: JSON.stringify(entry) });
      S.report = entry; renderReport(); show("report");
      loadBooks();
    } catch (x) { fail(x, T("Couldn't save it.", "저장을 못 했어요.")); }
    busy("");
  }

  // Revision is the part of writing that actually teaches. Reopening a saved
  // report keeps the original AI draft, keeps every earlier edit, and says out
  // loud that this is a rewrite - not a fresh run.
  function editReport(b) {
    S.editingId = b.id;
    S.editBase = b;
    S.asProfile = b.profile || "henry";        // voice and level follow the owner, not the viewer
    S.title = b.title; S.author = b.author || ""; S.cover = b.cover || null; S.thumb = b.thumb || null;
    S.lang = b.lang === "ko" ? "ko" : "en";
    S.genre = b.genre || "other"; S.kind = b.kind || "fiction";
    S.audience = b.audience || "me";
    S.order = (b.order && b.order.length) ? b.order.slice() : SECTIONS.map(function (x) { return x[0]; });
    S.ans = b.answers || []; S.fans = b.follow || [];
    S.draft = JSON.parse(JSON.stringify(b.report || {}));
    S.edits = (b.edits || []).slice();
    S.report0 = b.report0 || null;             // legacy books have none, and we don't invent one
    err(""); renderConfirm(); show("report");
  }

  function bookReader(b) {
    var m = PROFILES.filter(function (x) { return x.id === (b.profile || "henry"); })[0];
    return m ? m.name : "Reader";
  }
  function reportText(b) {
    var r = b.report || {}, st = Math.max(1, Math.min(5, parseInt(r.stars) || 3));
    return ["BOOK REPORT — " + b.title + (b.author ? " by " + b.author : ""), "Read by " + bookReader(b) + "   Finished " + b.date + "   " + "★".repeat(st) + "☆".repeat(5 - st), "",
      ((b.order && b.order.length) ? b.order : SECTIONS.map(function (x) { return x[0]; }))
        .map(function (k) { return r[k]; }).filter(Boolean).join("\n\n"), "", "— written in Book Lab"].filter(Boolean).join("\n");
  }
  function renderReport() {
    var b = S.report, r = b.report || {}, R = $("report"); R.innerHTML = "";
    var box = el("div", "box");
    box.innerHTML = '<div class="head" style="display:flex;gap:13px">' + ((b.thumb || b.cover) ? '<img src="' + (b.thumb || b.cover) + '" style="width:62px;height:86px;object-fit:cover;border-radius:7px" alt=""/>' : '') +
      '<div style="flex:1;min-width:0"><div style="font-size:10px;color:var(--sub);letter-spacing:.12em">BOOK REPORT</div><div style="font-size:17px;font-weight:900;line-height:1.25;margin-top:3px">' + esc(b.title) + '</div>' +
      (b.author ? '<div style="font-size:12px;color:var(--sub)">' + esc(b.author) + '</div>' : '') + '<div style="font-size:11px;color:var(--sub);margin-top:5px">Finished ' + esc(b.date) + '</div><div style="font-size:15px;color:var(--gold);margin-top:3px">' + stars(r.stars) + '</div></div></div>' +
      '<div class="essay">' +
      ((b.order && b.order.length) ? b.order : SECTIONS.map(function (x) { return x[0]; }))
        .map(function (k) { return r[k]; }).filter(Boolean)
        .map(function (t) { return '<p>' + esc(t) + '</p>'; }).join("") + '</div>';
    R.appendChild(box);

    var sc = el("div", "box");
    sc.innerHTML = '<div style="font-size:12px;font-weight:800;margin-bottom:11px">' +
        '<span style="color:var(--sub)">= ' + T("same", "같은 생각") + ' ' + b.aiWins + '</span>' +
        '<span style="color:var(--line)"> · </span>' +
        '<span style="color:var(--violet)">\u2726 ' + T("different", "다른 생각") + ' ' + b.henryWins + '</span></div>' +
      (b.answers || []).map(function (a) { return '<div class="ans"><span style="color:' + (a.aiSame ? "var(--sub)" : "var(--violet)") + ';font-weight:800">' + (a.aiSame ? "=" : "\u2726") + '</span><div style="flex:1"><div class="qq">' + esc(a.q) + '</div><div class="aa">' + T("You said: ", "고른 답: ") + esc(a.pickedText) + '</div></div></div>'; }).join("") +
      '<p class="note">' + T("Every \u2726 is a place where you and the AI read it differently. Neither of you is automatically right \u2014 but only one of you actually read the book. That\'s worth remembering.",
                             "\u2726 는 " + RN() + "와 AI가 다르게 읽은 곳이에요. 누가 자동으로 맞는 건 아니에요 \u2014 다만 책을 진짜 읽은 사람은 한 명뿐이죠. 그걸 기억해요.") + '</p>';
    R.appendChild(sc);

    if (b.report0) R.appendChild(firstDraft(b));
    if ((b.edits || []).length) R.appendChild(editLog(b));

    // what almost everyone does next is read another book, so that is the coloured
    // one; printing is real but rare, and sits below with copy
    var again = el("button", "big green", "↻ " + T("Do another book", "다른 책 하기"));
    again.style.marginBottom = "10px";
    again.onclick = function () { resetRun(); show("library"); };
    R.appendChild(again);

    var btns = el("div"); btns.style.cssText = "display:flex;gap:9px";
    var pr = el("button", "big plain", "🖨 " + T("Print it", "인쇄하기")); pr.style.cssText = "font-size:13px;flex:1;min-width:0";
    pr.onclick = function () { printReport(b); };
    var cp = el("button", "big plain", "⧉ " + T("Copy", "복사")); cp.style.cssText = "font-size:13px;flex:1;min-width:0";
    cp.onclick = async function () { try { await navigator.clipboard.writeText(reportText(b)); busy(T("Copied!", "복사됐어요!")); setTimeout(function () { busy(""); }, 1600); } catch (x) { err("Couldn't copy on this device."); } };
    btns.appendChild(pr); btns.appendChild(cp); R.appendChild(btns);

  }
  function firstDraft(b) {
    var box = el("div", "box"), open = false;
    var head = el("button", "sm", "✦ " + T("What the AI wrote first", "AI가 처음 쓴 글"));
    head.style.cssText = "width:100%;text-align:left;font-size:12px;font-weight:800;color:var(--sub);background:transparent;padding:0";
    var body = el("div"); body.className = "hide"; body.style.marginTop = "10px";
    body.innerHTML = '<div class="essay" style="opacity:.72">' +
      ((b.order && b.order.length) ? b.order : SECTIONS.map(function (x) { return x[0]; }))
        .map(function (k) { return b.report0[k]; }).filter(Boolean)
        .map(function (t) { return '<p>' + esc(t) + '</p>'; }).join("") + '</div>' +
      '<p class="note">' + T("This is the draft before any of your changes. Yours is above.",
                             "고치기 전 초안이에요. 위에 있는 게 " + RN() + "가 만든 글이고요.") + '</p>';
    head.onclick = function () { open = !open; body.classList.toggle("hide", !open); };
    box.appendChild(head); box.appendChild(body);
    return box;
  }

  function editLog(b) {
    var box = el("div", "box"), open = false;
    var head = el("button", "sm", "✎ " + T("What I changed", "내가 고친 것") + " · " + b.edits.length);
    head.style.cssText = "width:100%;text-align:left;font-size:12px;font-weight:800;color:var(--violet);background:transparent;padding:0";
    var body = el("div"); body.className = "hide"; body.style.marginTop = "10px";
    b.edits.forEach(function (e, i) {
      var d = el("div");
      d.style.cssText = "padding:9px 0;border-top:" + (i ? "1px solid var(--line)" : "none");
      d.innerHTML = '<div style="font-size:11px;color:var(--violet);font-weight:800">' + esc(e.custom ? '“' + e.custom + '”' : e.label) +
        ' <span style="color:var(--sub);font-weight:400">· ' + esc(e.section) + '</span></div>' +
        '<div style="font-size:11px;color:var(--sub);line-height:1.5;margin-top:4px;text-decoration:line-through">' + esc(e.before) + '</div>' +
        '<div style="font-size:12px;line-height:1.5;margin-top:3px">' + esc(e.after) + '</div>';
      body.appendChild(d);
    });
    head.onclick = function () { open = !open; body.classList.toggle("hide", !open); };
    box.appendChild(head); box.appendChild(body);
    return box;
  }

  function printReport(b) {
    var w = window.open("", "_blank"); if (!w) { err("Your browser blocked the print window."); return; }
    var r = b.report || {}, st = Math.max(1, Math.min(5, parseInt(r.stars) || 3));
    var paras = ((b.order && b.order.length) ? b.order : SECTIONS.map(function (x) { return x[0]; }))
      .map(function (k) { return r[k]; }).filter(Boolean)
      .map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("");
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(b.title) + '</title><style>body{font-family:Georgia,serif;max-width:640px;margin:40px auto;padding:0 24px;line-height:1.65;color:#222}h1{font-size:24px;margin:0 0 4px}.meta{color:#777;font-size:13px;margin-bottom:24px}p{margin:0 0 .8em;font-size:15.5px;text-indent:1.3em}p:first-of-type{text-indent:0}p:first-of-type::first-letter{float:left;font-size:3.1em;line-height:.84;margin:.06em .08em 0 0;color:#1E7BC8;font-weight:700}.foot{margin-top:32px;font-size:12px;color:#999;border-top:1px solid #ddd;padding-top:10px}</style></head><body><h1>' + esc(b.title) + '</h1><div class="meta">' + (b.author ? esc(b.author) + " &middot; " : "") + 'Read by ' + esc(bookReader(b)) + ' &middot; Finished ' + esc(b.date) + ' &middot; ' + "★".repeat(st) + "☆".repeat(5 - st) + '</div>' +
      paras +
      '<div class="foot">Quiz &mdash; same as the AI: ' + b.aiWins + ', read it differently: ' + b.henryWins + ' &middot; written in Book Lab</div></body></html>');
    w.document.close(); setTimeout(function () { w.print(); }, 400);
  }

  function resetRun() { S.title = ""; S.author = ""; S.cover = null; S.qs = []; S.qi = 0; S.ans = []; S.picked = null; S.fqs = []; S.fi = 0; S.fans = []; S.report = null; S.audience = null; S.order = []; S.draft = null; S.edits = []; S.editingId = null; S.editBase = null; S.asProfile = null; S.report0 = null; err(""); renderLibrary(); }

  // ---------- boot
  $("homeBtn").onclick = function () { resetRun(); show("library"); };
  $("saveSetup").onclick = function () {
    var c = $("code").value.trim();
    if (!c) { $("code").focus(); return; }
    cfg.code = c;
    localStorage.setItem("bl:srv", cfg.srv); localStorage.setItem("bl:code", cfg.code);
    $("setup").classList.add("hide"); renderWho(); show("library"); loadMe(); loadBooks();
  };
  $("code").onkeydown = function (e) { if (e.key === "Enter") $("saveSetup").click(); };
  if (needSetup()) { $("setup").classList.remove("hide"); $("code").focus(); }
  applyTheme(localStorage.getItem("bl:theme") === "night" ? "night" : "day");
  $("themeBtn").onclick = function () {
    var t = document.documentElement.getAttribute("data-theme") === "day" ? "night" : "day";
    localStorage.setItem("bl:theme", t); applyTheme(t);
  };
  renderWho(); renderLibrary(); loadMe(); loadBooks(); show("library");
})();
</script>
</body>
</html>
