<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" preserveAspectRatio="xMidYMax slice">
  <!-- Oia, more or less. Whitewashed cubes stacked down a cliff, cobalt domes,
       one bell tower, a few sun-warmed walls. Drawn flat on purpose - it sits
       at the foot of every screen and must never compete with the reading. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF4F8"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E93D6"/>
      <stop offset="1" stop-color="#1A5FA8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE2F4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7FC3E8" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <!-- the Aegean, far below -->
  <rect x="0" y="196" width="1200" height="34" fill="url(#sea)"/>
  <path d="M0 196h1200v6H0z" fill="#FFFFFF" opacity=".5"/>

  <g stroke="none">
    <!-- ================ left cluster ================ -->
    <rect x="16"  y="120" width="86"  height="78" rx="5" fill="url(#wall)"/>
    <rect x="58"  y="96"  width="64"  height="102" rx="5" fill="url(#wall)"/>
    <path d="M58 96q32-26 64 0z" fill="url(#dome)"/>
    <rect x="110" y="138" width="54"  height="60" rx="5" fill="#F6E2BC"/>
    <rect x="150" y="112" width="72"  height="86" rx="5" fill="url(#wall)"/>
    <path d="M150 112q36-30 72 0z" fill="url(#dome)"/>
    <rect x="182" y="96"  width="5"   height="20" rx="2" fill="#1A5FA8"/>
    <rect x="177" y="102" width="15"  height="4"  rx="2" fill="#1A5FA8"/>

    <!-- bell tower -->
    <rect x="232" y="76"  width="40"  height="122" rx="4" fill="url(#wall)"/>
    <path d="M232 76q20-18 40 0z" fill="#E9EFF5"/>
    <circle cx="244" cy="104" r="7" fill="#1A5FA8" opacity=".85"/>
    <circle cx="260" cy="104" r="7" fill="#1A5FA8" opacity=".85"/>
    <rect x="249" y="58" width="5" height="20" rx="2" fill="#1A5FA8"/>
    <rect x="244" y="64" width="15" height="4" rx="2" fill="#1A5FA8"/>

    <rect x="280" y="128" width="78"  height="70" rx="5" fill="url(#wall)"/>
    <rect x="344" y="104" width="62"  height="94" rx="5" fill="url(#wall)"/>
    <path d="M344 104q31-26 62 0z" fill="url(#dome)"/>
    <rect x="396" y="146" width="58"  height="52" rx="5" fill="#EFE3D4"/>

    <!-- ================ middle cluster ================ -->
    <rect x="446" y="116" width="92"  height="82" rx="5" fill="url(#wall)"/>
    <rect x="504" y="88"  width="70"  height="110" rx="5" fill="url(#wall)"/>
    <path d="M504 88q35-30 70 0z" fill="url(#dome)"/>
    <rect x="536" y="68"  width="5"   height="22" rx="2" fill="#1A5FA8"/>
    <rect x="530" y="75"  width="16"  height="4"  rx="2" fill="#1A5FA8"/>
    <rect x="562" y="140" width="66"  height="58" rx="5" fill="#F6E2BC"/>
    <rect x="618" y="112" width="84"  height="86" rx="5" fill="url(#wall)"/>
    <path d="M618 112q42-28 84 0z" fill="url(#dome)" opacity=".92"/>
    <rect x="694" y="134" width="60"  height="64" rx="5" fill="url(#wall)"/>

    <!-- steps down the cliff -->
    <g fill="#E4EDF4">
      <rect x="752" y="186" width="40" height="12" rx="3"/>
      <rect x="766" y="174" width="40" height="12" rx="3"/>
      <rect x="780" y="162" width="40" height="12" rx="3"/>
      <rect x="794" y="150" width="40" height="12" rx="3"/>
    </g>

    <!-- ================ right cluster ================ -->
    <rect x="836" y="120" width="80"  height="78" rx="5" fill="url(#wall)"/>
    <rect x="884" y="94"  width="66"  height="104" rx="5" fill="url(#wall)"/>
    <path d="M884 94q33-28 66 0z" fill="url(#dome)"/>
    <rect x="944" y="142" width="54"  height="56" rx="5" fill="#EFE3D4"/>
    <rect x="990" y="110" width="76"  height="88" rx="5" fill="url(#wall)"/>
    <path d="M990 110q38-26 76 0z" fill="url(#dome)" opacity=".9"/>
    <rect x="1022" y="90" width="5"   height="22" rx="2" fill="#1A5FA8"/>
    <rect x="1016" y="97" width="16"  height="4"  rx="2" fill="#1A5FA8"/>
    <rect x="1056" y="134" width="70" height="64" rx="5" fill="url(#wall)"/>
    <rect x="1112" y="116" width="72" height="82" rx="5" fill="url(#wall)"/>
    <path d="M1112 116q36-24 72 0z" fill="url(#dome)" opacity=".85"/>

    <!-- windows and doors, cobalt like every shutter on the island -->
    <g fill="#2E6FB0" opacity=".55">
      <rect x="34"  y="146" width="13" height="17" rx="2"/>
      <rect x="62"  y="146" width="13" height="17" rx="2"/>
      <rect x="126" y="160" width="13" height="17" rx="2"/>
      <rect x="168" y="150" width="13" height="17" rx="2"/>
      <rect x="196" y="150" width="13" height="17" rx="2"/>
      <rect x="300" y="150" width="13" height="17" rx="2"/>
      <rect x="326" y="150" width="13" height="17" rx="2"/>
      <rect x="412" y="164" width="13" height="17" rx="2"/>
      <rect x="466" y="142" width="13" height="17" rx="2"/>
      <rect x="500" y="142" width="13" height="17" rx="2"/>
      <rect x="580" y="160" width="13" height="17" rx="2"/>
      <rect x="640" y="150" width="13" height="17" rx="2"/>
      <rect x="668" y="150" width="13" height="17" rx="2"/>
      <rect x="712" y="156" width="13" height="17" rx="2"/>
      <rect x="856" y="146" width="13" height="17" rx="2"/>
      <rect x="888" y="146" width="13" height="17" rx="2"/>
      <rect x="960" y="162" width="13" height="17" rx="2"/>
      <rect x="1010" y="146" width="13" height="17" rx="2"/>
      <rect x="1076" y="156" width="13" height="17" rx="2"/>
      <rect x="1132" y="146" width="13" height="17" rx="2"/>
    </g>

    <!-- doorways, deeper -->
    <g fill="#1E4E86" opacity=".6">
      <rect x="88"  y="172" width="14" height="26" rx="3"/>
      <rect x="312" y="172" width="14" height="26" rx="3"/>
      <rect x="652" y="172" width="14" height="26" rx="3"/>
      <rect x="1090" y="172" width="14" height="26" rx="3"/>
    </g>

    <!-- bougainvillea -->
    <g fill="#D9628E" opacity=".55">
      <circle cx="108" cy="186" r="4"/><circle cx="116" cy="180" r="3"/><circle cx="101" cy="179" r="3"/>
      <circle cx="438" cy="184" r="4"/><circle cx="446" cy="178" r="3"/>
      <circle cx="744" cy="186" r="4"/><circle cx="736" cy="180" r="3"/>
      <circle cx="1048" cy="184" r="4"/><circle cx="1040" cy="178" r="3"/>
    </g>
  </g>
</svg>
