<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" preserveAspectRatio="xMidYMax slice">
  <!-- A row of spines, drawn by hand. Sits at the foot of the page as a quiet
       reminder of what this is for. Muted on purpose - it must never compete
       with the text above it. -->
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B45B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#D9B45B" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <g stroke="none">
    <!-- upright spines: x, width, height, colour -->
    <rect x="18"   y="34"  width="26" height="108" rx="3" fill="#8E4436"/>
    <rect x="48"   y="52"  width="19" height="90"  rx="3" fill="#4E6B57"/>
    <rect x="71"   y="26"  width="31" height="116" rx="3" fill="#2E3E4E"/>
    <rect x="106"  y="46"  width="15" height="96"  rx="2" fill="#A8863C"/>
    <rect x="125"  y="40"  width="24" height="102" rx="3" fill="#6B4A6E"/>
    <rect x="153"  y="58"  width="18" height="84"  rx="2" fill="#8E4436"/>
    <rect x="175"  y="30"  width="28" height="112" rx="3" fill="#3F5C52"/>
    <rect x="207"  y="50"  width="21" height="92"  rx="3" fill="#5A4334"/>

    <!-- two leaning against the stack -->
    <rect x="236"  y="44"  width="22" height="100" rx="3" fill="#2E3E4E" transform="rotate(7 247 144)"/>
    <rect x="262"  y="54"  width="17" height="90"  rx="2" fill="#A8863C" transform="rotate(11 270 144)"/>

    <!-- a short flat stack, as if someone put them down mid-read -->
    <rect x="296"  y="118" width="86" height="12" rx="3" fill="#6B4A6E"/>
    <rect x="302"  y="130" width="86" height="12" rx="3" fill="#8E4436"/>

    <rect x="400"  y="36"  width="27" height="106" rx="3" fill="#4E6B57"/>
    <rect x="431"  y="56"  width="16" height="86"  rx="2" fill="#8E4436"/>
    <rect x="451"  y="28"  width="30" height="114" rx="3" fill="#5A4334"/>
    <rect x="485"  y="48"  width="20" height="94"  rx="3" fill="#2E3E4E"/>
    <rect x="509"  y="38"  width="25" height="104" rx="3" fill="#A8863C"/>
    <rect x="538"  y="60"  width="18" height="82"  rx="2" fill="#3F5C52"/>
    <rect x="560"  y="32"  width="29" height="110" rx="3" fill="#6B4A6E"/>
    <rect x="593"  y="52"  width="17" height="90"  rx="2" fill="#8E4436"/>

    <rect x="626"  y="42"  width="23" height="100" rx="3" fill="#2E3E4E"/>
    <rect x="653"  y="30"  width="31" height="112" rx="3" fill="#4E6B57"/>
    <rect x="688"  y="56"  width="15" height="86"  rx="2" fill="#A8863C"/>
    <rect x="707"  y="44"  width="26" height="98"  rx="3" fill="#5A4334"/>
    <rect x="737"  y="34"  width="20" height="108" rx="3" fill="#8E4436"/>
    <rect x="761"  y="58"  width="19" height="84"  rx="2" fill="#6B4A6E"/>

    <rect x="800"  y="120" width="78" height="11" rx="3" fill="#3F5C52"/>
    <rect x="806"  y="131" width="78" height="11" rx="3" fill="#2E3E4E"/>

    <rect x="898"  y="38"  width="28" height="104" rx="3" fill="#8E4436"/>
    <rect x="930"  y="54"  width="17" height="88"  rx="2" fill="#A8863C"/>
    <rect x="951"  y="28"  width="30" height="114" rx="3" fill="#4E6B57"/>
    <rect x="985"  y="48"  width="21" height="94"  rx="3" fill="#6B4A6E"/>
    <rect x="1010" y="36"  width="25" height="106" rx="3" fill="#2E3E4E"/>
    <rect x="1039" y="60"  width="18" height="82"  rx="2" fill="#5A4334"/>
    <rect x="1061" y="30"  width="29" height="112" rx="3" fill="#3F5C52"/>
    <rect x="1094" y="50"  width="20" height="92"  rx="3" fill="#8E4436"/>
    <rect x="1118" y="40"  width="26" height="102" rx="3" fill="#A8863C"/>
    <rect x="1148" y="56"  width="16" height="86"  rx="2" fill="#6B4A6E"/>
    <rect x="1168" y="34"  width="24" height="108" rx="3" fill="#4E6B57"/>

    <!-- gilt bands: the glint off lettering on old spines -->
    <g fill="url(#gilt)">
      <rect x="22"   y="56"  width="18" height="4"/>
      <rect x="75"   y="48"  width="23" height="4"/>
      <rect x="179"  y="52"  width="20" height="4"/>
      <rect x="404"  y="58"  width="19" height="4"/>
      <rect x="455"  y="50"  width="22" height="4"/>
      <rect x="564"  y="54"  width="21" height="4"/>
      <rect x="657"  y="52"  width="23" height="4"/>
      <rect x="955"  y="50"  width="22" height="4"/>
      <rect x="1065" y="52"  width="21" height="4"/>
      <rect x="1172" y="56"  width="16" height="4"/>
    </g>
  </g>
  <!-- the shelf board they stand on -->
  <rect x="0" y="142" width="1200" height="8" fill="#2A211A"/>
</svg>
