<svg xmlns="http://www.w3.org/2000/svg" width="44" height="34" viewBox="0 0 44 34">
  <!-- An open book with a little night sky over it. No dome and no cross: the
       first version read as a chapel and a bible, which is not what this is. -->
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FC0F0"/>
      <stop offset="1" stop-color="#1E7BC8"/>
    </linearGradient>
  </defs>

  <!-- four-point sparkles, the same shape the app uses for "you two read it differently" -->
  <g fill="#F0B429">
    <path d="M22 2.2q1.1 3.2 4.3 4.3-3.2 1.1-4.3 4.3-1.1-3.2-4.3-4.3 3.2-1.1 4.3-4.3Z"/>
    <path d="M33.5 6.5q.7 2.1 2.8 2.8-2.1.7-2.8 2.8-.7-2.1-2.8-2.8 2.1-.7 2.8-2.8Z" opacity=".85"/>
    <path d="M10.5 8.5q.55 1.6 2.1 2.1-1.6.55-2.1 2.1-.55-1.6-2.1-2.1 1.6-.55 2.1-2.1Z" opacity=".7"/>
  </g>

  <!-- the book, round-shouldered and open -->
  <g fill="none" stroke="url(#pg)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M22 18.5q-5-4-15-3.1v12.2q10-.9 15 3.1"/>
    <path d="M22 18.5q5-4 15-3.1v12.2q-10-.9-15 3.1"/>
  </g>
  <g stroke="#6FC0F0" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round">
    <path d="M10.5 20.5h7M10.5 24h7"/>
    <path d="M26.5 20.5h7M26.5 24h7"/>
  </g>
</svg>
