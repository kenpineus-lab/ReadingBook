<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F4FAFE" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Gowun+Dodum&display=swap" />
<title>Starry — 운영자</title>
<style>
  /* same island as the app: whitewash, cobalt, one sun */
  :root{
    --bg:#F4FAFE; --panel:#FFFFFF; --line:#DCEAF5; --text:#1E3D58; --sub:#7B97AD;
    --sky:#1E7BC8; --skyTop:#3E95DD; --sea:#0E9384; --sun:#F0B429; --red:#E1776B;
    --peri:#C9578E; --well:#F5FAFE; --chip:#EAF3FB; --on:#FFFFFF;
    --ui:'Quicksand','Gowun Dodum',system-ui,-apple-system,'Segoe UI',sans-serif;
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font-family:var(--ui);font-weight:500;
    background:
      radial-gradient(120% 60% at 50% -12%, rgba(120,190,235,.20) 0%, transparent 74%),
      linear-gradient(180deg,#fff 0%,var(--bg) 44%,#E6F2FA 100%);
    background-attachment:fixed}
  body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:0;
    background:url(assets/skyline.svg) repeat-x bottom center;background-size:auto 150px;opacity:.95;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 42%);mask-image:linear-gradient(180deg,transparent,#000 42%)}
  .wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:24px 16px 190px}
  h1{font-size:23px;font-weight:700;letter-spacing:.13em;color:var(--sky);margin:0 0 2px}
  .tag{font-size:13px;color:var(--sub);
    margin:0 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .box{background:#fff;border:1px solid var(--line);border-radius:26px;padding:19px;margin-bottom:13px;
    box-shadow:0 2px 6px -4px rgba(26,74,110,.14),0 18px 36px -26px rgba(26,74,110,.40)}
  .lbl{font-size:10px;letter-spacing:.14em;color:var(--sub);font-weight:700;text-transform:uppercase;margin-bottom:12px}
  label{display:block;font-size:11px;color:var(--sub);margin:12px 0 5px}
  input{width:100%;padding:13px 15px;border-radius:16px;background:var(--well);border:1px solid var(--line);
    color:var(--text);font-size:15px;outline:none;font-family:inherit}
  input:focus{border-color:var(--sky)}
  .btn{border:none;border-radius:999px;padding:16px;font-size:15.5px;font-weight:700;cursor:pointer;
    font-family:var(--ui);width:100%;transition:transform .09s}
  .btn:active{transform:scale(.985)}
  .sky{background:linear-gradient(180deg,var(--skyTop),var(--sky));color:var(--on)}
  .ghost{background:var(--chip);color:var(--text)}
  .sm{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--ui)}
  .sm:hover{border-color:var(--sub)}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .hh{border-top:1px solid var(--line);padding:14px 0}
  .hh:first-of-type{border-top:none}
  .hh h3{margin:0;font-size:16.5px;font-weight:700}
  .meta{font-size:12px;color:var(--sub);margin-top:3px}
  .pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;
    padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--sub);margin-left:7px}
  .pill.on{background:var(--sea);color:#04372C}
  .note{font-size:11.5px;color:var(--sub);line-height:1.65;margin:10px 0 0}
  .bad{color:var(--red)}
  .ok{color:#1E9E7E}
  .invite{background:var(--well);border:1px dashed var(--sky);border-radius:20px;
    padding:14px;margin-top:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  /* --on is white now (it sits on the cobalt button); the code sits on paper */
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;
    letter-spacing:.06em;color:var(--sky)}
  .hide{display:none!important}
  .spin{width:15px;height:15px;border:2px solid var(--sky);border-top-color:transparent;
    border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>STARRY</h1>
  <p class="tag">운영자 화면 — 가족을 만들고, 코드를 나눠 줍니다.</p>

  <div id="gate" class="box hide">
    <div class="lbl">운영자 코드</div>
    <p class="note" style="margin:0 0 4px">Railway의 <b>ADMIN_CODE</b> 값입니다. 이 기기에만 저장됩니다.</p>
    <label>서버 주소</label>
    <input id="srv" placeholder="https://readingbook-production.up.railway.app" />
    <label>ADMIN_CODE</label>
    <input id="adm" type="password" placeholder="운영자 코드" autocomplete="off" />
    <button id="enter" class="btn sky" style="margin-top:14px">들어가기</button>
    <p id="gateErr" class="note bad hide"></p>
  </div>

  <div id="main" class="hide">
    <div class="box">
      <div class="row" style="justify-content:space-between">
        <div class="lbl" style="margin:0">가족 목록</div>
        <button id="refresh" class="sm">새로고침</button>
      </div>
      <div id="list" style="margin-top:12px"><span class="spin"></span></div>
    </div>

    <div class="box">
      <div class="lbl">새 가족 만들기</div>
      <label>가족 이름 <span style="color:#B9C6D0">— 나만 보는 이름이에요</span></label>
      <input id="nName" placeholder="예: 지영이네" />
      <label>참여 코드 <span style="color:#B9C6D0">— 그 집에 알려줄 코드</span></label>
      <div class="row" style="flex-wrap:nowrap;gap:8px">
        <input id="nCode" placeholder="코드" style="flex:1" />
        <button id="gen" class="sm" style="white-space:nowrap">만들어줘</button>
      </div>
      <div class="row" style="margin-top:14px;gap:8px">
        <button id="bkp" class="sm">☐ 깃헙 백업</button>
        <button id="cap" class="sm">하루 AI 300회</button>
      </div>
      <p class="note">백업을 켜면 그 집 기록이 <b>내 깃헙 저장소</b>에 저장됩니다. 남의 집 아이 글이라면 먼저 물어보세요.</p>
      <button id="create" class="btn sky" style="margin-top:14px">만들고 초대문 받기</button>
      <p id="newErr" class="note bad hide"></p>
      <div id="invite" class="invite hide"></div>
      <button id="copy" class="btn ghost hide" style="margin-top:10px">초대문 복사하기</button>
    </div>

    <button id="out" class="btn ghost">운영자 코드 지우기</button>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DEFAULT_SRV = "https://readingbook-production.up.railway.app";
  var APP = location.origin + location.pathname.replace(/admin\.html?$/, "");
  var srv = localStorage.getItem("bl:srv") || DEFAULT_SRV;
  var adm = localStorage.getItem("bl:admin") || "";
  var newBackup = false, newCap = 300;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  async function api(path, opts) {
    var o = Object.assign({ headers: { "content-type": "application/json", "x-admin-code": adm } }, opts || {});
    var r = await fetch(srv.replace(/\/$/, "") + path, o);
    if (r.status === 401) throw new Error("운영자 코드가 맞지 않아요.");
    if (!r.ok) {
      var d = null;
      try { d = (await r.json()).detail; } catch (e) { }
      throw new Error(typeof d === "string" ? d : (d && d.detail) || ("서버 오류 " + r.status));
    }
    return r.json();
  }

  // A code someone has to read out over the phone. Two words and a number beats
  // a random string every time.
  var W1 = ["파랑", "노랑", "초록", "보라", "하양", "분홍", "주황", "민트"];
  var W2 = ["여우", "수달", "고래", "부엉이", "판다", "토끼", "거북", "사슴"];
  function makeCode() {
    var a = W1[Math.floor(Math.random() * W1.length)];
    var b = W2[Math.floor(Math.random() * W2.length)];
    return a + b + (1000 + Math.floor(Math.random() * 9000));
  }

  function show(which) {
    $("gate").classList.toggle("hide", which !== "gate");
    $("main").classList.toggle("hide", which === "gate");
  }

  async function load() {
    $("list").innerHTML = '<span class="spin"></span>';
    try {
      var hs = await api("/households");
      if (!hs.length) { $("list").innerHTML = '<p class="note" style="margin:0">아직 없어요. 아래에서 첫 가족을 만들어 보세요.</p>'; return; }
      $("list").innerHTML = hs.map(function (h) {
        return '<div class="hh"><div class="row" style="justify-content:space-between">' +
          '<h3>' + esc(h.name) + (h.backup ? '<span class="pill on">백업</span>' : '') + '</h3>' +
          '<div class="row" style="gap:6px">' +
            '<button class="sm" data-act="code" data-hh="' + h.hh + '" data-name="' + esc(h.name) + '">코드 바꾸기</button>' +
            '<button class="sm" data-act="del" data-hh="' + h.hh + '" data-name="' + esc(h.name) + '" data-books="' + h.books + '">지우기</button>' +
          '</div></div>' +
          '<div class="meta">읽는 사람 ' + h.readers + '명 · 책 ' + h.books + '권 · ' +
          '오늘 AI ' + h.ai_today + '/' + h.ai_cap + '회 · ' + esc(h.created) + ' 시작</div></div>';
      }).join("");
      Array.prototype.forEach.call($("list").querySelectorAll("button[data-act]"), function (b) {
        b.onclick = function () { rowAction(b.getAttribute("data-act"), b); };
      });
    } catch (e) {
      $("list").innerHTML = '<p class="note bad" style="margin:0">' + esc(e.message) + '</p>';
      if (/코드가 맞지/.test(e.message)) { show("gate"); $("gateErr").textContent = e.message; $("gateErr").classList.remove("hide"); }
    }
  }

  async function rowAction(act, b) {
    var hh = b.getAttribute("data-hh"), name = b.getAttribute("data-name");
    if (act === "code") {
      var next = prompt(name + " 의 새 참여 코드를 정해 주세요.\n(예전 코드는 즉시 못 쓰게 됩니다)", makeCode());
      if (!next) return;
      try { await api("/households/" + hh, { method: "PATCH", body: JSON.stringify({ code: next.trim() }) }); showInvite(name, next.trim()); load(); }
      catch (e) { alert(e.message); }
      return;
    }
    var books = parseInt(b.getAttribute("data-books") || "0", 10);
    var warn = books
      ? name + " 를 지우면 저장된 책 " + books + "권과 독후감이 전부 사라집니다.\n되돌릴 수 없습니다. 정말 지울까요?"
      : name + " 를 지울까요?";
    if (!confirm(warn)) return;
    if (books && !confirm("마지막 확인입니다. " + books + "권을 영구히 지웁니다.")) return;
    try { await api("/households/" + hh + (books ? "?purge=1" : ""), { method: "DELETE" }); load(); }
    catch (e) { alert(e.message); }
  }

  function showInvite(name, code) {
    var text =
      "✨ Starry · 별밤 초대\n\n" +
      "1. 이 주소를 여세요 — " + APP + "\n" +
      "2. 가족 코드에 " + code + " 를 입력하고 저장\n" +
      "3. ＋ 를 눌러 읽는 사람을 추가하면 끝이에요\n\n" +
      "책 표지를 찍으면 AI가 퀴즈를 내고, 독후감을 같이 씁니다.\n" +
      "AI는 그 책을 읽지 않았으니 가끔 틀립니다 — 그걸 잡아내는 게 재미예요.";
    $("invite").classList.remove("hide");
    $("invite").innerHTML = '<b>' + esc(name) + '</b> 준비됐어요. 참여 코드:<br><span class="code">' + esc(code) + '</span>\n\n' + esc(text);
    $("copy").classList.remove("hide");
    $("copy").onclick = async function () {
      try { await navigator.clipboard.writeText(text); $("copy").textContent = "복사했어요!"; setTimeout(function () { $("copy").textContent = "초대문 복사하기"; }, 1600); }
      catch (e) { alert("이 기기에서는 복사가 안 돼요. 위 글을 길게 눌러 직접 복사해 주세요."); }
    };
    $("invite").scrollIntoView({ block: "center", behavior: "smooth" });
  }

  // ---- gate
  $("srv").value = srv;
  $("enter").onclick = async function () {
    srv = ($("srv").value.trim() || DEFAULT_SRV).replace(/\/$/, "");
    adm = $("adm").value.trim();
    if (!adm) { $("adm").focus(); return; }
    $("gateErr").classList.add("hide");
    try {
      await api("/households");
      localStorage.setItem("bl:srv", srv); localStorage.setItem("bl:admin", adm);
      show("main"); load();
    } catch (e) {
      $("gateErr").textContent = e.message; $("gateErr").classList.remove("hide");
    }
  };
  $("adm").onkeydown = function (e) { if (e.key === "Enter") $("enter").click(); };
  $("out").onclick = function () { localStorage.removeItem("bl:admin"); adm = ""; $("adm").value = ""; show("gate"); };
  $("refresh").onclick = load;

  // ---- new household
  $("gen").onclick = function () { $("nCode").value = makeCode(); };
  $("bkp").onclick = function () {
    newBackup = !newBackup;
    $("bkp").textContent = (newBackup ? "☑" : "☐") + " 깃헙 백업";
    $("bkp").style.borderColor = newBackup ? "var(--sea)" : "var(--line)";
    $("bkp").style.color = newBackup ? "#1E9E7E" : "var(--sub)";
  };
  $("cap").onclick = function () {
    var caps = [100, 300, 1000];
    newCap = caps[(caps.indexOf(newCap) + 1) % caps.length];
    $("cap").textContent = "하루 AI " + newCap + "회";
  };
  $("create").onclick = async function () {
    var name = $("nName").value.trim(), code = $("nCode").value.trim();
    $("newErr").classList.add("hide");
    if (!name) { $("nName").focus(); return; }
    if (code.length < 6) { $("newErr").textContent = "코드는 6자 이상이어야 해요."; $("newErr").classList.remove("hide"); $("nCode").focus(); return; }
    try {
      await api("/households", { method: "POST", body: JSON.stringify({ name: name, code: code, backup: newBackup, ai_cap: newCap }) });
      showInvite(name, code);
      $("nName").value = ""; $("nCode").value = "";
      load();
    } catch (e) { $("newErr").textContent = e.message; $("newErr").classList.remove("hide"); }
  };

  if (adm) { show("main"); load(); } else { show("gate"); }
})();
</script>
</body>
</html>
